<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <label be-clonable>
        <input type="checkbox" name="">
        <span>Check me out</span>
    </label>
    <div id=target></div>
    <script type=module>
        import '/emc.js';
    </script>
    <script>
        function runTest(){
            document.querySelector('.be-clonable-trigger').click();

            setTimeout(() => {
                const count = document.querySelectorAll('input[type="checkbox"]').length;
                if(count === 2){
                    target.setAttribute('mark', 'good');
                }
            }, 50);
        }
        setTimeout(() => {
            runTest();
        }, 500)
    </script>
</body>
</html>
