<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- No be-clonable attribute, and no be-hive. -->
    <label id="label">
        <input type="checkbox" name="">
        <span>Check me out</span>
    </label>
    <script type=module>
        import {defBeClonable} from '/def.js';
        //only the first call needs to use .set
        //it triggers the attachment of the enhancement.
        label.enh.set.beClonable.buttonContent = '❏';
        await defBeClonable(document.body);
        console.log(label.enh.beClonable);
    </script>
</body>
</html>
